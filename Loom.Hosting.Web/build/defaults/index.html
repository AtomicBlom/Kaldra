<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Relative base so the app works from an unpredictable sub-path (e.g. an itch.io page, a local server). -->
  <base href="./" />
  <title>Loom</title>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: the canvas runs on under a phone's camera cutout and gesture bar, whose bands the host reports
       to the app as its safe area (LoomApplication.SafeAreaInsets) for its UI to keep clear of -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #14141a; color: #d8d8e0;
                 font-family: system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
    /* The dynamic viewport (dvw, dvh): what is on screen now, between a phone browser's address bar and its toolbar.
       vh is the viewport with those bars hidden, so while they show, a canvas that tall runs on under them and the
       UI at its top and bottom edges is covered. vw and vh stay first for a browser without dv units. */
    #loom-canvas { display: block; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
    /* The status line lets the pointer through to the canvas: faded out once the app runs, it still sits over the
       corner, where an app's own UI may be. An error can be selected, to copy it. */
    #status { position: fixed; left: 10px; bottom: 8px; font-size: 12px; opacity: 0.65; pointer-events: none;
               white-space: pre-wrap; max-width: 90vw; max-height: 40vh; overflow-y: auto; }
    #status.status-error { background: rgba(20, 12, 14, 0.9); border: 1px solid rgba(255, 100, 100, 0.5);
               border-radius: 4px; padding: 8px 10px; color: #ffb0b0; pointer-events: auto; }
  </style>
  <script type="module" src="main.js"></script>
</head>

<body>
  <canvas id="loom-canvas"></canvas>
  <div id="status">loading .NET runtime…</div>
</body>

</html>
