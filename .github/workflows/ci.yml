name: CI

# Build the engine (including both GPU backends, so the offscreen/hosted-application tests link and self-register)
# and run the unit tests. No GPU is needed: the GPU-gated tests (the offscreen render tests) auto-skip when no device
# is available, and the rest are backend-neutral (describe/execute layers, graph export, frustum math, asset source).
# The golden-image and cross-backend parity tests are the gallery's, in Kaldra.Gallery.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # A Windows runner: Loom.Tests references both GPU backends (below), whose shader-compile step runs the Slang
    # compiler, and Slang.Sdk packages a native slangc only for win-x64 / win-arm64 (the DirectX12 backend also signs
    # its DXIL with the Windows DXC), so a Linux runner can't build it.
    #
    # A pull request from a fork runs on a GitHub-hosted runner. Everything else (pushes to master, and pull requests
    # from this repository's own branches, which only someone with write access can push) runs on the self-hosted one,
    # which on a box with a real device runs the GPU-gated tests instead of skipping them.
    # SECURITY: a fork's pull request runs the workflow files on its own branch, so it could change this line. What
    # keeps it off the self-hosted runner is the repository's setting that a fork's workflows wait for approval
    # (Settings > Actions > General, "Require approval for all external contributors"): read a fork's workflow changes
    # before approving its run.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'windows-latest' || fromJSON('["self-hosted", "windows"]') }}
    steps:
      - uses: actions/checkout@v7

      # Loom.Tests references both GPU backends (for OffscreenEngineTests' self-registration), and the Vulkan
      # backend references the VMASharp submodule, so building the tests needs VMASharp checked out, alongside
      # SUIsei (needed by the NativeAOT gate + UI unit test steps below).
      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.PAT }}
        shell: bash
        run: |
          # While SUIsei is private its checkout takes the PAT secret (contents:read on AtomicBlom/SUIsei), which a
          # fork's pull request doesn't get. The PAT goes on this one command (and the clones it starts), not in the
          # runner user's global config: jobs on one machine share that file, and two writing it at once fail to lock it.
          if [ -n "$GH_PAT" ]; then auth=(-c url."https://${GH_PAT}@github.com/".insteadOf="https://github.com/"); else auth=(); fi
          git "${auth[@]}" submodule update --init --recursive external/SUIsei external/VMASharp

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      # Compiling the Slang shaders dominates a run, and checkout wipes obj/ so it happens every time. This restores
      # the compiled outputs from a directory on the runner's own disk, keyed by a hash of the shader sources, the
      # package versions (which pin slangc + DXC), and the shader targets (which hold the compile flags).
      #
      # Local rather than actions/cache on purpose: the runner is self-hosted, so a directory costs no network
      # round-trip and none of the repository's 10 GB cache allowance. Restore deletes each destination before
      # copying, so a stale .dxil from a renamed shader can never survive into the package — see the script's header.
      # A GitHub-hosted runner starts empty every time, so there it compiles them.
      - name: Restore shader cache
        id: shader-cache
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: pwsh tools/shader-cache.ps1 -Mode restore

      # Build the tests and everything they reference — the engine, both GPU backends, and the Slang/DXC shader
      # toolchain that the backends compile through (hence a Windows runner; see runs-on above).
      - name: Build (engine + backends + tests)
        run: dotnet build Loom.Tests/Loom.Tests.csproj -c Release

      # Only on a miss: a hit restored exactly what this key produces, so there is nothing new to store.
      - name: Save shader cache
        if: runner.environment == 'self-hosted' && steps.shader-cache.outputs.hit != 'true'
        shell: pwsh
        run: pwsh tools/shader-cache.ps1 -Mode save

      # TUnit runs on Microsoft.Testing.Platform; the repo-root global.json opts `dotnet test` into MTP mode,
      # which takes the project via --project (the bare path form is VSTest-only and removed in the .NET 10 SDK).
      - name: Test (no-GPU unit tests; the GPU-gated ones auto-skip)
        run: dotnet test --project Loom.Tests/Loom.Tests.csproj -c Release --no-build

      # NativeAOT gate: SUIsei is marked <IsAotCompatible>, which turns on the trim/AOT/single-file Roslyn
      # analyzers; build it with warnings promoted to errors so any reflection or AOT-unsafe pattern fails CI.
      # The UI runtime is neutral (Core + Assets only), so it builds without a GPU.
      - name: NativeAOT gate (SUIsei; AOT/trim analyzers as errors)
        run: dotnet build external/SUIsei/SUIsei/SUIsei.csproj -c Release -p:TreatWarningsAsErrors=true

      # The headless UI unit tests (draw-list/Dump golden, neutral types) — no backend, like the graph tests above.
      - name: Build + test (UI no-GPU unit tests)
        run: |
          dotnet build external/SUIsei/SUIsei.Tests/SUIsei.Tests.csproj -c Release
          dotnet test --project external/SUIsei/SUIsei.Tests/SUIsei.Tests.csproj -c Release --no-build
