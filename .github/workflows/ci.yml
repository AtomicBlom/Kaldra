name: CI

# Build the engine (including both GPU backends, so the offscreen/hosted-application tests link and self-register)
# and run the unit tests. No GPU is needed: the GPU-gated tests (golden-image, cross-backend parity, and the
# offscreen render tests) auto-skip when no device is available, and the rest are backend-neutral (describe/execute
# layers, graph export, frustum math, asset source).
#
# The golden-image regression (GoldenImageTests) is deliberately NOT run here: it needs a GPU to produce the
# captures, and GitHub-hosted runners have none. It is opt-in (skipped unless LOOM_GOLDEN_DIR is set) and is run
# locally via tools/golden.ps1 — wire a self-hosted GPU runner to add it to CI later.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    # Self-hosted Windows runner: Loom.Tests references both GPU backends (below), whose shader-compile step runs
    # the Slang compiler — and Slang.Sdk packages a native slangc only for win-x64 / win-arm64 (the DirectX12
    # backend also signs its DXIL with the Windows DXC), so a Linux runner can't build it. A self-hosted runner
    # keeps this off GitHub-hosted minutes and, on a box with a real device, runs the GPU-gated tests instead of
    # skipping them.
    # SECURITY: safe only while this repo is PRIVATE. Before making it public, remove the self-hosted runner (a
    # fork's PR could otherwise run arbitrary code on it) and switch back to `runs-on: windows-latest`.
    runs-on: [self-hosted, windows]
    steps:
      # SUIsei is a private submodule; it is fetched separately below with a PAT.
      - uses: actions/checkout@v7

      # Loom.Tests references both GPU backends (for OffscreenEngineTests' self-registration), and the Vulkan
      # backend references the VMASharp submodule — so building the tests needs VMASharp checked out, alongside
      # SUIsei (needed by the NativeAOT gate + UI unit test steps below). VMASharp is public; SUIsei is private, so
      # wire the PAT (contents:read on AtomicBlom/SUIsei) before init so both resolve.
      - name: Checkout submodules (PAT for private SUIsei)
        env:
          GH_PAT: ${{ secrets.PAT }}
        shell: bash
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive external/SUIsei external/VMASharp

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Build the tests and everything they reference — the engine, both GPU backends, and the Slang/DXC shader
      # toolchain that the backends compile through (hence the Windows runner; see runs-on above).
      - name: Build (engine + backends + tests)
        run: dotnet build Loom.Tests/Loom.Tests.csproj -c Release

      # TUnit runs on Microsoft.Testing.Platform; the repo-root global.json opts `dotnet test` into MTP mode,
      # which takes the project via --project (the bare path form is VSTest-only and removed in the .NET 10 SDK).
      - name: Test (no-GPU unit tests; golden-image regression auto-skips)
        run: dotnet test --project Loom.Tests/Loom.Tests.csproj -c Release --no-build

      # NativeAOT gate: SUIsei is marked <IsAotCompatible>, which turns on the trim/AOT/single-file Roslyn
      # analyzers; build it with warnings promoted to errors so any reflection or AOT-unsafe pattern fails CI.
      # The UI runtime is neutral (Core + Assets only), so it builds on this no-GPU runner.
      - name: NativeAOT gate (SUIsei; AOT/trim analyzers as errors)
        run: dotnet build external/SUIsei/SUIsei/SUIsei.csproj -c Release -p:TreatWarningsAsErrors=true

      # The headless UI unit tests (draw-list/Dump golden, neutral types) — no backend, like the graph tests above.
      - name: Build + test (UI no-GPU unit tests)
        run: |
          dotnet build external/SUIsei/SUIsei.Tests/SUIsei.Tests.csproj -c Release
          dotnet test --project external/SUIsei/SUIsei.Tests/SUIsei.Tests.csproj -c Release --no-build
