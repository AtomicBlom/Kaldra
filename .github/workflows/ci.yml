name: CI

# Build the solution and run the backend-neutral unit tests (describe/execute layers, graph export, frustum math,
# asset source). These need no GPU, so they run on the standard GitHub-hosted runners.
#
# The golden-image regression (GoldenImageTests) is deliberately NOT run here: it needs a GPU to produce the
# captures, and GitHub-hosted runners have none. It is opt-in (skipped unless LOOM_GOLDEN_DIR is set) and is run
# locally via tools/golden.ps1 — wire a self-hosted GPU runner to add it to CI later.

on:
  push:
    branches: [master, Milestone13, loom-ui]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Loom.Tests only references Core/Graph/Assets — no submodule needed for that job.
      # SUIsei is a private submodule; it is fetched separately below with a PAT.
      - uses: actions/checkout@v4

      # Fetch the private SUIsei submodule using a PAT that has contents:read on AtomicBlom/SUIsei.
      # VMASharp (public) is not needed by Loom.Tests, so we only init the SUIsei submodule.
      - name: Checkout SUIsei submodule
        env:
          GH_PAT: ${{ secrets.PAT }}
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init external/SUIsei

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build only the neutral layers + tests (no GPU backends, no Slang/DXC toolchain on the runner).
      - name: Build (neutral layers + tests)
        run: dotnet build Loom.Tests/Loom.Tests.csproj -c Release

      # TUnit runs on Microsoft.Testing.Platform; the repo-root global.json opts `dotnet test` into MTP mode,
      # which takes the project via --project (the bare path form is VSTest-only and removed in the .NET 10 SDK).
      - name: Test (no-GPU unit tests; golden-image regression auto-skips)
        run: dotnet test --project Loom.Tests/Loom.Tests.csproj -c Release --no-build

      # NativeAOT gate: SUIsei is marked <IsAotCompatible>, which turns on the trim/AOT/single-file Roslyn
      # analyzers; build it with warnings promoted to errors so any reflection or AOT-unsafe pattern fails CI.
      # The UI runtime is neutral (Core + Assets only), so it builds on this no-GPU runner.
      - name: NativeAOT gate (SUIsei; AOT/trim analyzers as errors)
        run: dotnet build external/SUIsei/SUIsei/SUIsei.csproj -c Release -p:TreatWarningsAsErrors=true

      # The headless UI unit tests (draw-list/Dump golden, neutral types) — no backend, like the graph tests above.
      - name: Build + test (UI no-GPU unit tests)
        run: |
          dotnet build external/SUIsei/SUIsei.Tests/SUIsei.Tests.csproj -c Release
          dotnet test --project external/SUIsei/SUIsei.Tests/SUIsei.Tests.csproj -c Release --no-build
