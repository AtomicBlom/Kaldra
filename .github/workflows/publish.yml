name: Publish NuGet packages

# Packs every package an app can take from the engine (tools/pack-local.ps1): the engine, its hosts, backends and UI
# adapters, the SDK and VMASharp's. A push to master publishes a test build to GitHub Packages (Version.props' version,
# then .ci.<run>). A v* tag publishes the release to nuget.org, versioned by the tag (v0.2.0 packs 0.2.0). A dispatch
# packs without publishing.
#
# The Vysara adapter is built against Vysara's released package, at the version Directory.Packages.props pins
# (-VysaraFromPackage), so its dependency names a Vysara that exists. Release that Vysara first, then move the pin.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # test builds, to GitHub Packages
  id-token: write   # releases: nuget.org's trusted publishing, a short-lived key from GitHub's OIDC token

jobs:
  publish:
    name: Pack and publish
    # Windows for the Windows SDK's DXC, which signs the DXIL
    runs-on: windows-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      TEST_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      # nuget.config's GitHub Packages source reads it, for a pinned Vysara that is only there
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # SourceLink wants the history
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      # BinaryVibrance.Kaldra.Hosting.Android's package needs it
      - name: Install the android workload
        run: dotnet workload install android

      - name: Choose the version
        shell: pwsh
        run: |
          if ($env:RELEASE -eq 'true') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          else { $version = (dotnet msbuild BinaryVibrance.Kaldra.Core/BinaryVibrance.Kaldra.Core.csproj -getProperty:Version).Trim() + ".ci.${{ github.run_number }}" }
          Write-Host "Packing $version"
          "VERSION=$version" >> $env:GITHUB_ENV

      # Generate LLM orientation files before packing (llms.txt is included in BinaryVibrance.Kaldra.Core's package)
      - name: Generate LLM docs
        run: dotnet run --file tools/generate-llms-docs.cs

      - name: Pack
        shell: pwsh
        run: ./tools/pack-local.ps1 -Version $env:VERSION -Output artifacts/packages -VysaraFromPackage

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

      - name: Publish the test build to GitHub Packages
        if: env.TEST_BUILD == 'true'
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/AtomicBlom/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Log in to nuget.org
        if: env.RELEASE == 'true'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the release to nuget.org
        if: env.RELEASE == 'true'
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --skip-duplicate
